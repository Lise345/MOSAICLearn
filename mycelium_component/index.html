<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOSAIC Mycelium</title>
<style>
:root{
  --text:#344139;--muted:#626b62;--line:#cfd3ca;--green:#156950;--blue:#0d4f9e;
  --cyan:#88cdd3;--lime:#a2ab20;--wine:#9c2438;--soft:#f6f6f4;--paper:#fff;
}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:transparent}
#app{width:100%;padding:0}
.toolbar{display:flex;gap:.5rem;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 .55rem}
.legend{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;gap:.35rem;align-items:center}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid #9da6a0}
.legend i.pending{border-top-style:dashed;border-top-color:var(--wine)}
.help{font-size:12px;color:var(--muted)}
.viewport{position:relative;width:100%;height:520px;overflow:hidden;border:1px solid #cdc9bb;border-radius:18px;background-color:#e9e8df;touch-action:none;user-select:none;isolation:isolate}
.viewport:focus{outline:3px solid rgba(13,79,158,.22);outline-offset:2px}
/* The botanical drawing lives inside .scene, so it pans and zooms with the learner cards. */
.network-art{position:absolute;left:0;top:0;width:2600px;height:1560px;object-fit:fill;opacity:.29;pointer-events:none;user-select:none;filter:grayscale(1)}
.scene{position:absolute;left:0;top:0;transform-origin:0 0;width:2600px;height:1560px;z-index:1}
svg.edges{position:absolute;inset:0;width:2600px;height:1560px;overflow:visible;pointer-events:none;z-index:1}
.edge{stroke:#587267;stroke-width:2.4;opacity:.95;vector-effect:non-scaling-stroke}
.edge.me{stroke:var(--green);stroke-width:3.4;opacity:1}
.edge.pending{stroke:var(--wine);stroke-dasharray:7 7;stroke-width:2.2}
.edge.drag{stroke:var(--blue);stroke-dasharray:5 5;stroke-width:2.2}
.node{position:absolute;z-index:2;width:150px;min-height:72px;padding:10px 12px 10px 46px;border:1px solid #d4d8d5;border-radius:16px;background:rgba(255,255,255,.97);box-shadow:0 2px 9px rgba(40,50,45,.10);cursor:grab;transform:translate(-50%,-50%) scale(var(--node-scale,1));touch-action:none}
.node:active{cursor:grabbing}
.node.current{border:2px solid var(--green);background:#f2f8f5}
.node.blocked{opacity:.82}
.avatar{position:absolute;left:10px;top:12px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#edf5f2;color:var(--green);font-weight:700;font-size:12px}
.name{font-weight:700;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.meta{margin-top:3px;color:var(--muted);font-size:11px;line-height:1.3;overflow-wrap:anywhere}
.handle{position:absolute;right:-9px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;border:3px solid #fff;background:var(--blue);box-shadow:0 0 0 1px rgba(13,79,158,.25);cursor:crosshair}
.handle::after{content:"+";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;line-height:1}
.node.blocked .handle{display:none}
.zoom-controls{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:5}
.zoom-controls button{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);font-size:20px;cursor:pointer}
.zoom-controls button:focus{outline:3px solid rgba(13,79,158,.22)}
.empty{padding:1rem;color:var(--muted);font-size:14px}
.modal-backdrop{position:absolute;inset:0;background:rgba(30,36,33,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal-backdrop.open{display:flex}
.modal{width:min(420px,100%);border-radius:16px;background:#fff;border:1px solid var(--line);padding:16px;box-shadow:0 14px 40px rgba(30,35,32,.18)}
.modal h3{margin:.1rem 0 .35rem;font-size:18px}
.modal p{margin:.2rem 0 .8rem;color:var(--muted);font-size:13px;line-height:1.5}
.check{display:flex;gap:.55rem;align-items:flex-start;margin:.8rem 0 1rem;font-size:13px;line-height:1.45}
.check input{width:18px;height:18px;margin-top:1px}
.actions{display:flex;gap:.55rem;justify-content:flex-end;flex-wrap:wrap}
.actions button{min-height:40px;padding:.55rem .85rem;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--text);font-weight:600;cursor:pointer}
.actions button.primary{border-color:var(--green);background:var(--green);color:#fff}
.actions button:focus{outline:3px solid rgba(13,79,158,.22)}
.status{min-height:20px;margin-top:.4rem;font-size:12px;color:var(--muted)}
@media(max-width:620px){
  .viewport{height:430px}
  .node{width:126px;min-height:66px;padding:9px 10px 9px 40px;border-radius:14px}
  .avatar{left:8px;top:10px;width:25px;height:25px}
  .name{font-size:13px}.meta{font-size:10px}
}
</style>
</head>
<body>
<div id="app">
  <div class="toolbar">
    <div class="legend" aria-label="Network legend">
      <span><i></i> connection</span><span><i class="pending"></i> your pending request</span>
    </div>
    <div class="help">Drag the background to explore · drag cards to rearrange · drag + to connect · scroll/pinch to zoom</div>
  </div>
  <div id="viewport" class="viewport" tabindex="0" aria-label="Interactive Mycelium network">
    <div id="scene" class="scene">
      <!-- Decorative image is part of the pannable/zoomable scene, not the fixed viewport. -->
      <img src="mycelium-illustration.png" class="network-art" alt="" aria-hidden="true" draggable="false">
      <svg id="edges" class="edges" viewBox="0 0 2600 1560" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div id="nodes"></div>
    </div>
    <div class="zoom-controls" aria-label="Zoom controls">
      <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
      <button id="reset" type="button" aria-label="Reset view">⌂</button>
      <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
    </div>
    <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal">
        <h3 id="modalTitle">Send connection request</h3>
        <p id="modalCopy"></p>
        <label class="check"><input id="shareEmail" type="checkbox"><span>Share my email address with this learner as part of the request.</span></label>
        <div class="actions">
          <button id="cancelRequest" type="button">Cancel</button>
          <button id="sendRequest" class="primary" type="button">Send request</button>
        </div>
        <div id="status" class="status" aria-live="polite"></div>
      </div>
    </div>
  </div>
</div>
<script>
(() => {
  const READY="streamlit:componentReady";
  const RENDER="streamlit:render";
  const SET_VALUE="streamlit:setComponentValue";
  const SET_HEIGHT="streamlit:setFrameHeight";
  const send=(type,data={})=>window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},data),"*");
  const setValue=(value)=>send(SET_VALUE,{value,dataType:"json"});
  const setHeight=()=>send(SET_HEIGHT,{height:document.documentElement.scrollHeight});

  const viewport=document.getElementById("viewport");
  const scene=document.getElementById("scene");
  const nodesLayer=document.getElementById("nodes");
  const edgesSvg=document.getElementById("edges");
  const modalBackdrop=document.getElementById("modalBackdrop");
  const modalCopy=document.getElementById("modalCopy");
  const shareEmail=document.getElementById("shareEmail");
  const sendRequest=document.getElementById("sendRequest");
  const cancelRequest=document.getElementById("cancelRequest");
  const status=document.getElementById("status");

  let props={members:[],connections:[],pending:[],current_user_id:"",blocked_user_ids:[]};
  let positions=new Map();
  let nodeEls=new Map();
  let scale=1, panX=0, panY=0;
  let draggingNode=null, draggingLink=null, panning=null, pinch=null, selectedTarget=null;
  const activePointers=new Map();
  const WORLD_W=2600, WORLD_H=1560;
  const CARD_VISUAL_RATIO=0.82; // The cards are slightly smaller relative to the botanical drawing.


  function initials(name){
    return String(name||"?").split(/\s+/).filter(Boolean).slice(0,2).map(s=>s[0].toUpperCase()).join("")||"?";
  }
  function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
  function memberById(id){return (props.members||[]).find(m=>String(m.user_id)===String(id));}
  function clientToScene(clientX,clientY){
    const r=viewport.getBoundingClientRect();
    return {x:(clientX-r.left-panX)/scale,y:(clientY-r.top-panY)/scale};
  }
  function applyTransform(){
    scene.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;
    // Keep cards legible while the much larger background zooms in and out.
    // Their centers remain fixed to the interactive connection coordinates.
    const inverse=clamp(CARD_VISUAL_RATIO/scale,.48,4.0);
    nodeEls.forEach(el=>el.style.setProperty("--node-scale",inverse));
    drawEdges();
  }
  function defaultPositions(){
    // Give the first ~10 learners a small cluster within a much larger mycelium.
    // New arrivals receive open locations without moving existing learner cards.
    const cx=WORLD_W/2, cy=WORLD_H*.64;
    const members=props.members||[];
    const own=String(props.current_user_id);
    if(members.some(m=>String(m.user_id)===own) && !positions.has(own)){
      positions.set(own,{x:cx,y:cy});
    }
    const others=members.filter(m=>String(m.user_id)!==own);
    for(const m of others){
      const id=String(m.user_id);
      if(positions.has(id)) continue;
      // A stable open-place search avoids overlaps even when people join later.
      // The first nodes inhabit a fairly compact organic ring, leaving plenty
      // of surrounding mycelium for growth. Further rings become available.
      let best=null;
      for(let slot=0;slot<350;slot++){
        const ring=Math.floor(slot/9);
        const ringIndex=slot%9;
        const angle=-Math.PI/2 + .29 + (ringIndex/9)*2*Math.PI + ring*.30;
        const rx=820+ring*390;
        const ry=440+ring*220;
        const x=cx+Math.cos(angle)*rx;
        const y=cy+Math.sin(angle)*ry;
        // Reserve roughly a card-width / card-height around every location.
        const free=[...positions.values()].every(p=>Math.abs(p.x-x)>420 || Math.abs(p.y-y)>225);
        if(free){best={x,y};break;}
      }
      // Extremely large communities can extend the pannable plane naturally.
      if(!best){
        const i=positions.size;
        const angle=i*2.3999632297;
        const radius=980+Math.sqrt(i)*180;
        best={x:cx+Math.cos(angle)*radius,y:cy+Math.sin(angle)*radius};
      }
      positions.set(id,best);
    }
  }
  function fitView(){
    defaultPositions();
    const r=viewport.getBoundingClientRect();
    // On larger screens, reveal the complete illustration instead of zooming
    // into the first few learners and making the mycelium look 'full'.
    const vals=[...positions.values()];
    const left=Math.min(0,...vals.map(p=>p.x-100));
    const right=Math.max(WORLD_W,...vals.map(p=>p.x+100));
    const top=Math.min(0,...vals.map(p=>p.y-85));
    const bottom=Math.max(WORLD_H,...vals.map(p=>p.y+85));
    const overview=Math.min((r.width-28)/(right-left),(r.height-28)/(bottom-top));
    if(r.width>=700){
      scale=clamp(overview,.18,1.05);
      panX=(r.width-(left+right)*scale)/2;
      panY=(r.height-(top+bottom)*scale)/2;
    } else {
      // On narrow screens, show an explorable section at readable card size.
      scale=.42;
      panX=r.width/2-(WORLD_W/2)*scale;
      panY=r.height/2-(WORLD_H*.64)*scale;
    }
    applyTransform();
  }
  function line(x1,y1,x2,y2,cls){
    const l=document.createElementNS("http://www.w3.org/2000/svg","line");
    l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);l.setAttribute("class",cls);
    edgesSvg.appendChild(l);
  }
  function drawEdges(){
    edgesSvg.innerHTML="";
    for(const e of (props.connections||[])){
      const a=positions.get(String(e.source)),b=positions.get(String(e.target));
      if(!a||!b) continue;
      const mine=String(e.source)===String(props.current_user_id)||String(e.target)===String(props.current_user_id);
      line(a.x,a.y,b.x,b.y,`edge${mine?" me":""}`);
    }
    for(const e of (props.pending||[])){
      const a=positions.get(String(e.source)),b=positions.get(String(e.target));
      if(a&&b) line(a.x,a.y,b.x,b.y,"edge pending");
    }
    if(draggingLink){
      const a=positions.get(String(props.current_user_id));
      if(a) line(a.x,a.y,draggingLink.x,draggingLink.y,"edge drag");
    }
  }
  function openModal(targetId){
    const target=memberById(targetId); if(!target) return;
    selectedTarget=String(targetId); shareEmail.checked=false; status.textContent="";
    modalCopy.textContent=`Invite ${target.name||"this learner"} to connect in the MOSAIC Mycelium?`;
    modalBackdrop.classList.add("open"); sendRequest.focus();
  }
  function closeModal(){modalBackdrop.classList.remove("open");selectedTarget=null;status.textContent="";}
  function renderNodes(){
    nodesLayer.innerHTML="";nodeEls.clear();defaultPositions();
    const blocked=new Set((props.blocked_user_ids||[]).map(String));
    for(const m of (props.members||[])){
      const id=String(m.user_id); const pos=positions.get(id); if(!pos) continue;
      const el=document.createElement("div");
      el.className=`node${id===String(props.current_user_id)?" current":""}${blocked.has(id)&&id!==String(props.current_user_id)?" blocked":""}`;
      el.dataset.userId=id; el.style.left=`${pos.x}px`;el.style.top=`${pos.y}px`;
      const meta=[m.organisation,m.country].filter(Boolean).join(" · ");
      el.innerHTML=`<div class="avatar"></div><div class="name"></div><div class="meta"></div>`;
      el.querySelector(".avatar").textContent=initials(m.name);
      el.querySelector(".name").textContent=m.name||"Learner";
      el.querySelector(".meta").textContent=meta||"MOSAIC learner";
      if(id===String(props.current_user_id)){
        const handle=document.createElement("div");handle.className="handle";handle.setAttribute("role","button");handle.setAttribute("aria-label","Drag to connect with another learner");handle.tabIndex=0;
        handle.addEventListener("pointerdown",ev=>{ev.stopPropagation();handle.setPointerCapture(ev.pointerId);const p=clientToScene(ev.clientX,ev.clientY);draggingLink={pointerId:ev.pointerId,x:p.x,y:p.y};drawEdges();});
        handle.addEventListener("pointermove",ev=>{if(!draggingLink||draggingLink.pointerId!==ev.pointerId)return;const p=clientToScene(ev.clientX,ev.clientY);draggingLink.x=p.x;draggingLink.y=p.y;drawEdges();});
        handle.addEventListener("pointerup",ev=>{
          if(!draggingLink||draggingLink.pointerId!==ev.pointerId)return;
          const candidate=document.elementFromPoint(ev.clientX,ev.clientY)?.closest?.(".node");
          draggingLink=null;drawEdges();
          if(candidate&&candidate.dataset.userId&&candidate.dataset.userId!==String(props.current_user_id)&&!blocked.has(candidate.dataset.userId)) openModal(candidate.dataset.userId);
        });
        el.appendChild(handle);
      }
      el.addEventListener("pointerdown",ev=>{
        if(ev.target.closest(".handle")) return;
        el.setPointerCapture(ev.pointerId);const p=clientToScene(ev.clientX,ev.clientY);const cur=positions.get(id);
        draggingNode={pointerId:ev.pointerId,id,dx:p.x-cur.x,dy:p.y-cur.y};
      });
      el.addEventListener("pointermove",ev=>{
        if(!draggingNode||draggingNode.pointerId!==ev.pointerId||draggingNode.id!==id)return;
        const p=clientToScene(ev.clientX,ev.clientY);const next={x:p.x-draggingNode.dx,y:p.y-draggingNode.dy};positions.set(id,next);el.style.left=`${next.x}px`;el.style.top=`${next.y}px`;drawEdges();
      });
      el.addEventListener("pointerup",ev=>{if(draggingNode?.pointerId===ev.pointerId&&draggingNode.id===id)draggingNode=null;});
      nodesLayer.appendChild(el);nodeEls.set(id,el);
    }
    drawEdges();applyTransform();
  }
  function zoomAt(factor,cx,cy){
    const r=viewport.getBoundingClientRect();const x=cx-r.left,y=cy-r.top;
    const before={x:(x-panX)/scale,y:(y-panY)/scale};const next=clamp(scale*factor,.12,2.1);
    panX=x-before.x*next;panY=y-before.y*next;scale=next;applyTransform();
  }
  viewport.addEventListener("wheel",ev=>{ev.preventDefault();zoomAt(ev.deltaY<0?1.1:.91,ev.clientX,ev.clientY);},{passive:false});
  function beginPinch(){
    if(activePointers.size!==2) return;
    const [a,b]=[...activePointers.values()];
    const cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
    const rect=viewport.getBoundingClientRect();
    pinch={distance:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),startScale:scale,
      anchorX:(cx-rect.left-panX)/scale,anchorY:(cy-rect.top-panY)/scale};
    panning=null;
  }
  viewport.addEventListener("pointerdown",ev=>{
    if(ev.target.closest(".node")||ev.target.closest("button")||ev.target.closest(".modal")) return;
    viewport.setPointerCapture(ev.pointerId);
    activePointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    if(activePointers.size===2){beginPinch();return;}
    if(activePointers.size===1){pinch=null;panning={pointerId:ev.pointerId,x:ev.clientX,y:ev.clientY,startX:panX,startY:panY};}
  });
  viewport.addEventListener("pointermove",ev=>{
    if(!activePointers.has(ev.pointerId)) return;
    activePointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    if(activePointers.size===2&&pinch){
      const [a,b]=[...activePointers.values()];
      const rect=viewport.getBoundingClientRect();
      const cx=(a.x+b.x)/2-rect.left,cy=(a.y+b.y)/2-rect.top;
      scale=clamp(pinch.startScale*Math.hypot(a.x-b.x,a.y-b.y)/pinch.distance,.12,2.1);
      panX=cx-pinch.anchorX*scale;panY=cy-pinch.anchorY*scale;
      applyTransform();return;
    }
    if(!panning||panning.pointerId!==ev.pointerId) return;
    panX=panning.startX+(ev.clientX-panning.x);
    panY=panning.startY+(ev.clientY-panning.y);
    applyTransform();
  });
  function endPointer(ev){
    activePointers.delete(ev.pointerId);
    if(panning?.pointerId===ev.pointerId)panning=null;
    if(activePointers.size===1){
      const [pointerId,pt]=[...activePointers.entries()][0];
      pinch=null;panning={pointerId,x:pt.x,y:pt.y,startX:panX,startY:panY};
    }else if(activePointers.size===0){pinch=null;panning=null;}
  }
  viewport.addEventListener("pointerup",endPointer);
  viewport.addEventListener("pointercancel",endPointer);
  document.getElementById("zoomIn").addEventListener("click",()=>{const r=viewport.getBoundingClientRect();zoomAt(1.15,r.left+r.width/2,r.top+r.height/2);});
  document.getElementById("zoomOut").addEventListener("click",()=>{const r=viewport.getBoundingClientRect();zoomAt(.87,r.left+r.width/2,r.top+r.height/2);});
  document.getElementById("reset").addEventListener("click",fitView);
  cancelRequest.addEventListener("click",closeModal);
  modalBackdrop.addEventListener("click",ev=>{if(ev.target===modalBackdrop)closeModal();});
  sendRequest.addEventListener("click",()=>{
    if(!selectedTarget)return;
    sendRequest.disabled=true;status.textContent="Sending request…";
    setValue({type:"request",target_user_id:selectedTarget,share_email:shareEmail.checked,nonce:`${Date.now()}-${Math.random().toString(16).slice(2)}`});
    window.setTimeout(()=>{sendRequest.disabled=false;closeModal();},180);
  });
  window.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&modalBackdrop.classList.contains("open"))closeModal();});
  window.addEventListener("resize",()=>{window.setTimeout(()=>{fitView();setHeight();},40);});
  window.addEventListener("message",event=>{
    if(event.data?.type!==RENDER)return;
    props=Object.assign({members:[],connections:[],pending:[],current_user_id:"",blocked_user_ids:[]},event.data.args||{});
    const valid=new Set((props.members||[]).map(m=>String(m.user_id)));
    [...positions.keys()].forEach(id=>{if(!valid.has(id))positions.delete(id);});
    renderNodes();window.setTimeout(()=>{fitView();setHeight();},0);
  });
  send(READY,{apiVersion:1});
  window.setTimeout(setHeight,0);
})();
</script>
</body>
</html>
